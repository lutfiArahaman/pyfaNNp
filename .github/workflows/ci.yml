name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing combination, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The package is developed on Windows; keep one job there so
          # platform-specific breakage is caught rather than assumed away.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        run: pytest -v

      - name: Run the paper listing
        # The listing in paper.md is a published claim about the API. If it
        # stops running, the paper is wrong, so CI executes it every time.
        run: python examples/listing.py

  figures:
    name: figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and plotting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[examples]"

      - name: Generate the architecture diagram
        run: python examples/architecture.py

      - name: Generate Figure 1
        run: python examples/figure1.py

      - name: Run the scaling experiment
        run: python examples/scaling.py

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check
        run: ruff check .
