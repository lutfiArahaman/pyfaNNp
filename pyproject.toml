[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfap"
version = "0.1.0"
description = "Coupled fuzzy AHP, neural network and PROMETHEE decision analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lutfi Rahaman", email = "lutfirahaman@gmail.com" }]
keywords = [
    "multi-criteria decision making",
    "fuzzy AHP",
    "PROMETHEE",
    "outranking",
    "neural network",
    "sensitivity analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
examples = ["pandas>=1.4", "matplotlib>=3.5"]
dev = ["pytest>=7.0", "pandas>=1.4", "matplotlib>=3.5", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/<USER>/pyfaNNp"
Repository = "https://github.com/<USER>/pyfaNNp"

[tool.setuptools.packages.find]
include = ["pyfap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
