[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfap"
version = "0.1.0"
description = "Coupled fuzzy AHP, neural network and PROMETHEE decision analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lutfi Rahaman", email = "lutfirahaman@gmail.com" }]
keywords = [
    "multi-criteria decision making",
    "fuzzy AHP",
    "PROMETHEE",
    "outranking",
    "neural network",
    "sensitivity analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
examples = ["pandas>=1.4", "matplotlib>=3.5"]
dev = ["pytest>=7.0", "pandas>=1.4", "matplotlib>=3.5", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/lutfiArahaman/pyfaNNp"
Repository = "https://github.com/lutfiArahaman/pyfaNNp"

[tool.setuptools.packages.find]
include = ["pyfap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
# Pin the classification so the example scripts, which import a sibling
# module by bare name, sort deterministically.
known-first-party = ["pyfap"]
known-local-folder = ["_style"]

[tool.ruff.lint.per-file-ignores]
# The block reproducing the paper listing accesses result attributes without
# doing anything with them, to show what the result object exposes. That is
# the point of the listing, so B018 (useless expression) does not apply.
"examples/listing.py" = ["B018"]

# The survey and cross-check scripts probe third-party packages that may
# fail to import, fail to call, or raise anything at all. Catching broadly
# and moving on is the intended behaviour: a submodule that will not import
# is a finding to report, not a reason to abort the run. S112 is allowed for
# the same reason -- the loops that skip a failed import already summarise
# the failures afterwards.
"tools/*.py" = ["BLE001", "S112"]
